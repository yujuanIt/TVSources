name: Publish personal sources

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'live.m3u'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/source-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-source-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate builder and adapter
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --experimental-vm-modules --test tests/*.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Generate public source files
        run: python3 scripts/build-source-site.py --base-url '${{ steps.pages.outputs.base_url }}/' --repository '${{ github.repository }}'
      - name: Publish files for free accelerator endpoints
        run: python3 scripts/publish-source-data.py --directory .tools/site
      - name: Upload source site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .tools/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy source site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
