name: Publish personal sources

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/source-pages.yml'
  workflow_dispatch:
    inputs:
      sync_live:
        description: '同步已登记的直播上游，再校验并发布'
        type: boolean
        default: true
      sync_vod:
        description: '同步已登记的 TVBox 站点，再校验并发布'
        type: boolean
        default: true
  schedule:
    # UTC; 北京时间 04:25、10:25、16:25、22:25，错开整点高峰。
    - cron: '25 2,8,14,20 * * *'
    # Only refresh public sports schedules/lines on these half-hour runs.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: personal-source-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Install synchronizer dependencies
        run: |
          python3 -m venv .tools/sync-venv
          .tools/sync-venv/bin/python -m pip install --requirement scripts/requirements-sync.txt
          echo "$GITHUB_WORKSPACE/.tools/sync-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh registered live upstreams
        if: (github.event_name == 'schedule' && github.event.schedule == '25 2,8,14,20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.sync_live)
        run: python3 scripts/sync-live.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Refresh sports channels and NBA CBA events
        if: github.event_name == 'schedule' && github.event.schedule == '7,37 * * * *'
        run: python3 scripts/sync-live.py --sports-only --summary "$GITHUB_STEP_SUMMARY"
      - name: Refresh registered TVBox sites
        if: (github.event_name == 'schedule' && github.event.schedule == '25 2,8,14,20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.sync_vod)
        run: python3 scripts/sync-vod.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Validate sources and editor
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
          node --check assets/editor.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Generate public source files
        run: python3 scripts/build-source-site.py --base-url '${{ steps.pages.outputs.base_url }}/' --repository '${{ github.repository }}'
      - name: Save validated source updates
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.sync_live || inputs.sync_vod))
        run: |
          git add -- data/live.m3u
          if test -f data/live-sync-state.json; then
            git add -- data/live-sync-state.json
          fi
          git add -- data/vod-sites.json
          if test -f data/vod-sync-state.json; then
            git add -- data/vod-sync-state.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: 同步直播线路与点播站点'
            git push origin HEAD:main
          fi
      - name: Publish files for free accelerator endpoints
        run: python3 scripts/publish-source-data.py --directory .tools/site
      - name: Upload source site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .tools/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy source site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
